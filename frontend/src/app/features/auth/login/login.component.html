<div class="login-container">
  <div class="login-split">
    <div class="login-left">
      <div class="branding animate-slide-up">
        <h1>Tekus</h1>
        <p>Provider Management Platform</p>
      </div>
    </div>
    <div class="login-right">
      <div class="glass-card login-card animate-fade-in">
        <h2 class="section-title">Welcome Back</h2>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          
          <mat-form-field appearance="fill" class="w-100">
            <mat-label>Email</mat-label>
            <input matInput type="email" formControlName="email" placeholder="Ex. admin@tekus.co">
            <mat-error *ngIf="loginForm.get('email')?.hasError('required')">Email is required</mat-error>
            <mat-error *ngIf="loginForm.get('email')?.hasError('email')">Please enter a valid email</mat-error>
          </mat-form-field>

          <mat-form-field appearance="fill" class="w-100">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" placeholder="Enter your password">
            <mat-error *ngIf="loginForm.get('password')?.hasError('required')">Password is required</mat-error>
            <mat-error *ngIf="loginForm.get('password')?.hasError('minlength')">Password must be at least 6 characters</mat-error>
          </mat-form-field>

          <button mat-raised-button class="btn-gradient-primary w-100 submit-btn" type="submit" [disabled]="loginForm.invalid || loading">
            <span *ngIf="!loading">Login</span>
            <mat-spinner *ngIf="loading" diameter="24"></mat-spinner>
          </button>
          
        </form>
      </div>
    </div>
  </div>
</div>
