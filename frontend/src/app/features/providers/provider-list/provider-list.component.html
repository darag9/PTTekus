<div class="page-container">
  <div class="header-actions">
    <h1 class="section-title">Providers</h1>
    
    <div class="actions-right">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search Providers</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput (keyup)="onSearch($event)" placeholder="Search by name, nit...">
      </mat-form-field>
      
      <button mat-raised-button class="btn-gradient-primary add-btn" (click)="openForm()">
        <mat-icon>add</mat-icon> Add Provider
      </button>
    </div>
  </div>

  <div class="glass-card table-container animate-slide-up">
    <table mat-table [dataSource]="providers" matSort class="w-100">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
        <td mat-cell *matCellDef="let p"> 
          <a [routerLink]="['/providers', p.id]" class="provider-link">{{p.name}}</a> 
        </td>
      </ng-container>

      <ng-container matColumnDef="nit">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> NIT </th>
        <td mat-cell *matCellDef="let p"> {{p.nit}} </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
        <td mat-cell *matCellDef="let p"> {{p.email}} </td>
      </ng-container>

      <ng-container matColumnDef="country">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Country </th>
        <td mat-cell *matCellDef="let p"> {{p.country}} </td>
      </ng-container>

      <ng-container matColumnDef="serviceCount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Services </th>
        <td mat-cell *matCellDef="let p">
          <span class="badge" [class.bg-cyan]="p.serviceCount > 0">{{p.serviceCount}}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let p" (click)="$event.stopPropagation()">
          <button mat-icon-button class="text-cyan" (click)="openForm(p)" matTooltip="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button class="text-error" (click)="deleteProvider(p.id, p.name)" matTooltip="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell text-center p-4" colspan="6">No providers found.</td>
      </tr>
    </table>

    <mat-paginator 
      [length]="totalCount" 
      [pageSize]="10" 
      [pageSizeOptions]="[5, 10, 25, 100]" 
      (page)="onPageChange()">
    </mat-paginator>
  </div>
</div>
