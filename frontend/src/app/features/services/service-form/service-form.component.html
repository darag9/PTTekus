<h2 mat-dialog-title class="dialog-title">{{ isEditMode ? 'Edit Service' : 'Add New Service' }}</h2>

<mat-dialog-content>
  <form [formGroup]="serviceForm" class="service-form">
    
    <mat-form-field appearance="fill" class="w-100 mt-2">
      <mat-label>Service Name</mat-label>
      <input matInput formControlName="name" placeholder="Enter service name">
      <mat-error *ngIf="serviceForm.get('name')?.hasError('required')">Name is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill" class="w-100">
      <mat-label>Base Hourly Rate</mat-label>
      <span matPrefix>$ &nbsp;</span>
      <input matInput type="number" formControlName="hourlyRate" placeholder="0.00">
      <mat-error *ngIf="serviceForm.get('hourlyRate')?.hasError('required')">Hourly rate is required</mat-error>
      <mat-error *ngIf="serviceForm.get('hourlyRate')?.hasError('min')">Must be non-negative</mat-error>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close [disabled]="loading">Cancel</button>
  <button mat-raised-button class="btn-gradient-primary" (click)="onSubmit()" [disabled]="serviceForm.invalid || loading">
    {{ isEditMode ? 'Update' : 'Create' }}
  </button>
</mat-dialog-actions>
