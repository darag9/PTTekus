<div class="page-container">
  <div class="header-actions">
    <h1 class="section-title">Services</h1>
    
    <div class="actions-right">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search Services</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput (keyup)="onSearch($event)" placeholder="Search by name...">
      </mat-form-field>
      
      <button mat-raised-button class="btn-gradient-primary add-btn" (click)="openForm()">
        <mat-icon>add</mat-icon> Add Service
      </button>
    </div>
  </div>

  <div class="glass-card table-container animate-slide-up">
    <table mat-table [dataSource]="services" matSort class="w-100">

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Name </th>
        <td mat-cell *matCellDef="let s" class="font-weight-500"> {{s.name}} </td>
      </ng-container>

      <ng-container matColumnDef="hourlyRate">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Hourly Rate </th>
        <td mat-cell *matCellDef="let s" class="text-cyan"> {{s.hourlyRate | currency}} </td>
      </ng-container>

      <ng-container matColumnDef="createdAt">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Created At </th>
        <td mat-cell *matCellDef="let s"> {{s.createdAt | date:'mediumDate'}} </td>
      </ng-container>

      <ng-container matColumnDef="providerCount">
        <th mat-header-cell *matHeaderCellDef mat-sort-header> Providers </th>
        <td mat-cell *matCellDef="let s">
          <span class="badge" [class.bg-violet]="s.providerCount > 0">{{s.providerCount || 0}}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let s">
          <button mat-icon-button class="text-cyan" (click)="openForm(s)" matTooltip="Edit">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button class="text-error" (click)="deleteService(s.id, s.name)" matTooltip="Delete">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell text-center p-4" colspan="5">No services found.</td>
      </tr>
    </table>

    <mat-paginator 
      [length]="totalCount" 
      [pageSize]="10" 
      [pageSizeOptions]="[5, 10, 25, 100]" 
      (page)="onPageChange()">
    </mat-paginator>
  </div>
</div>
