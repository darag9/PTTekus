<div class="app-container">
  <mat-toolbar class="topbar">
    <button mat-icon-button (click)="toggleSidenav()" class="menu-btn">
      <mat-icon>menu</mat-icon>
    </button>
    
    <span class="brand-title">Tekus</span>
    <span class="spacer"></span>
    
    <div class="user-info" *ngIf="user$ | async as user">
      <span class="user-name">{{ user.fullName }}</span>
      <button mat-button color="warn" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Logout
      </button>
    </div>
  </mat-toolbar>

  <mat-sidenav-container class="sidenav-container">
    <mat-sidenav [opened]="isSidenavOpen" mode="side" class="sidebar">
      <div class="sidebar-header">
        <mat-icon class="logo-icon">business</mat-icon>
        <h2>Provider Mgmt</h2>
      </div>
      <mat-nav-list>
        <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
          <mat-icon matListItemIcon>dashboard</mat-icon>
          <span matListItemTitle>Dashboard</span>
        </a>
        <a mat-list-item routerLink="/providers" routerLinkActive="active-link">
          <mat-icon matListItemIcon>groups</mat-icon>
          <span matListItemTitle>Providers</span>
        </a>
        <a mat-list-item routerLink="/services" routerLinkActive="active-link">
          <mat-icon matListItemIcon>design_services</mat-icon>
          <span matListItemTitle>Services</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <mat-sidenav-content class="main-content">
      <div class="content-wrapper animate-fade-in">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
